plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/*
 * Play 스토어 업로드 키. 저장소에는 넣지 않고 환경변수(GitHub Secrets)로만 받는다.
 * 없으면 release 빌드는 서명 없이 만들어지고, CI 는 AAB 를 건너뛴다.
 */
def uploadStore = System.getenv('UPLOAD_KEYSTORE_FILE')
def hasUploadKey = uploadStore != null && file(uploadStore).exists()

android {
    namespace 'com.earlln.screengolf'
    compileSdk 36

    defaultConfig {
        applicationId "com.earlln.screengolf"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        // 테스트 APK 용. 저장소에 들어 있어 다음 테스트 빌드도 덮어쓰기 설치된다.
        test {
            storeFile file('../test.keystore')
            storePassword 'android'
            keyAlias 'test'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        // 테스트 빌드: 실제 결제 대신 가짜 구매 창을 띄우고, 설정에 테스트 도구가 보인다.
        // 스토어 앱과 함께 깔 수 있도록 패키지 이름 뒤에 .test 를 붙인다.
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            signingConfig signingConfigs.test
            buildConfigField 'boolean', 'FAKE_BILLING', 'true'
        }
        release {
            minifyEnabled false
            if (hasUploadKey) signingConfig signingConfigs.upload
            buildConfigField 'boolean', 'FAKE_BILLING', 'false'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    testImplementation 'junit:junit:4.13.2'
}
