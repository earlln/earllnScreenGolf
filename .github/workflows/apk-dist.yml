name: APK dist

# 테스트 APK 를 apk-dist 브랜치에 올려 둔다 (earlln.com 다운로드용으로 가져가기 위함).
on:
  push:
    branches: [ccr-2be048ac-i0e2br]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle assembleDebug --no-daemon --stacktrace
      - name: Push APK to apk-dist branch
        run: |
          mkdir dist && cp app/build/outputs/apk/debug/app-debug.apk dist/EarllnScreenGolf-test.apk
          cd dist
          git init -q -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "EarllnScreenGolf test APK (${GITHUB_SHA})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
